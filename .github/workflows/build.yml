name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --stacktrace && break
            echo "Build gagal, coba lagi ($i/3)..."
            sleep 15
          done
          ls app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AOSPStackingRecent-debug
          path: app/build/outputs/apk/debug/*.apk
