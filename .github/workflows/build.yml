name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Info Gradle bawaan
        run: |
          gradle --version || true
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        run: |
          if ./gradlew assembleDebug --stacktrace; then
            echo "Build pakai wrapper berhasil"
          else
            echo "Wrapper gagal, pakai Gradle bawaan runner"
            gradle assembleDebug --stacktrace
          fi
          ls app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AOSPStackingRecent-debug
          path: app/build/outputs/apk/debug/*.apk
